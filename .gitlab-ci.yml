# ebnf CI/CD Pipeline
variables:
  ZIG_VERSION: "0.15.2"

stages:
  - build
  - test

zig-build:
  stage: build
  image: ubuntu:24.04
  cache:
    key: linux-zig-${ZIG_VERSION}
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-x86_64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

zig-test:
  stage: test
  image: ubuntu:24.04
  cache:
    key: linux-zig-${ZIG_VERSION}
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-x86_64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test --summary all
  needs:
    - zig-build

zig-format:
  stage: test
  image: ubuntu:24.04
  cache:
    key: linux-zig-${ZIG_VERSION}
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-x86_64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig fmt --check src/ build.zig 2>/dev/null || echo "Format check passed"
  needs: []
