stages:
  - build
  - test
  - security
  - sbom

include:
  # Dependency scanning and SBOM
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.0
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.0
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.0
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.0
    inputs:
      allow_failure: true

variables:
  ZIG_VERSION: "0.15.1"
  ZIG_INSTALL_DIR: "/tmp/zig"

.zig_setup: &zig_setup
  before_script:
    - apt-get update && apt-get install -y curl xz-utils
    - ./scripts/install-zig.sh
    - export PATH="${ZIG_INSTALL_DIR}/bin:$PATH"
    - zig version

build:
  stage: build
  image: debian:bookworm-slim
  <<: *zig_setup
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 hour

test:
  stage: test
  image: debian:bookworm-slim
  <<: *zig_setup
  script:
    - zig build test
